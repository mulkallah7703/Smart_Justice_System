# PJSR — private HTTP edge for Hostinger co-tenancy (SSH-tunnel testing).
#
# Bound on the host as 127.0.0.1:8083 → container :80 (see docker-compose.hostinger.yml).
# No TLS. No public 80/443. Does not replace host Nginx or production nginx.production.conf.
#
# Same-origin routing: browser → http://localhost:8083 (via tunnel)
#   /        → frontend
#   /api/    → api:3000  (HTTP + WebSocket upgrade for /api/v1/alerts/ws)
#   /health* → api

# Empty Upgrade → normal HTTP; "websocket" → Connection: upgrade.
# Lives at http{} scope via conf.d include (official nginx image).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pjsr_frontend {
    server frontend:80;
}

upstream pjsr_api {
    server api:3000;
}

server {
    listen 80;
    server_name _;

    # Security headers (no HSTS — private HTTP testing only)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;

    client_max_body_size 12m;

    location / {
        proxy_pass http://pjsr_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NestJS API — HTTP and live-alert WebSocket (/api/v1/alerts/ws).
    # Upgrade/Connection headers are required for ws://localhost:8083/... via the tunnel.
    # Normal REST requests send no Upgrade header → $connection_upgrade is "close".
    location /api/ {
        proxy_pass http://pjsr_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        # Keep WS idle connections alive longer than default for alert push.
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://pjsr_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass http://pjsr_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://pjsr_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
