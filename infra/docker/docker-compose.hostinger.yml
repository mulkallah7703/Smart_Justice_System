# PJSR — Hostinger co-tenancy profile (shared VPS)
#
# Isolated from the standard production stack (docker-compose.production.yml).
# Does NOT bind host :80 or :443. Does NOT compete with host Nginx.
#
# Usage (from repository root, on the VPS — do not run until operator-approved):
#   cp infra/docker/.env.hostinger.example infra/docker/.env.hostinger
#   # fill secrets; chmod 600
#   docker compose -p pjsr -f infra/docker/docker-compose.hostinger.yml \
#     --env-file infra/docker/.env.hostinger config
#   docker compose -p pjsr -f infra/docker/docker-compose.hostinger.yml \
#     --env-file infra/docker/.env.hostinger up -d --build
#
# Private access (SSH tunnel from your laptop):
#   ssh -L 8083:127.0.0.1:8083 root@76.13.40.84
#   http://localhost:8083
#
# Project name is fixed below. Prefer also passing -p pjsr for clarity.
# Qdrant Cloud + OpenAI remain external. Nafath inactive · Payment deferred.

name: pjsr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pjsr_pg_data:/var/lib/postgresql/data
    networks:
      - pjsr_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"
    mem_limit: 512m
    cpus: "0.50"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "192mb",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - pjsr_redis_data:/data
    networks:
      - pjsr_internal
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"
    mem_limit: 256m
    cpus: "0.25"

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - pjsr_minio_data:/data
    networks:
      - pjsr_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    expose:
      - "9000"
      - "9001"
    mem_limit: 256m
    cpus: "0.25"

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET};
      printf '%s\n' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${S3_BUCKET}\",\"arn:aws:s3:::$${S3_BUCKET}/*\"]}]}' > /tmp/pjsr-app-policy.json;
      mc admin policy create local pjsr-app-policy /tmp/pjsr-app-policy.json || true;
      mc admin user add local $${S3_ACCESS_KEY} $${S3_SECRET} || true;
      mc admin policy attach local pjsr-app-policy --user $${S3_ACCESS_KEY} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
    networks:
      - pjsr_internal
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    image: pjsr-api:${IMAGE_TAG:-hostinger-local}
    restart: unless-stopped
    # Optional on-disk file; prefer: --env-file infra/docker/.env.hostinger
    env_file:
      - path: .env.hostinger
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-openai}
      AI_LLM_MODE: ${AI_LLM_MODE:-openai}
      AI_EMBEDDING_MODE: ${AI_EMBEDDING_MODE:-openai}
      AI_VECTOR_STORE_MODE: ${AI_VECTOR_STORE_MODE:-qdrant}
      AI_TEXT_EXTRACTOR_MODE: ${AI_TEXT_EXTRACTOR_MODE:-pdf}
      AI_OCR_MODE: ${AI_OCR_MODE:-local}
      AI_OCR_TESSDATA: ${AI_OCR_TESSDATA:-fast}
      AI_ADVISOR_EXPERIMENTAL: ${AI_ADVISOR_EXPERIMENTAL:-true}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-1}
      AI_OCR_CONCURRENCY: ${AI_OCR_CONCURRENCY:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_QDRANT_URL: ${AI_QDRANT_URL}
      AI_QDRANT_API_KEY: ${AI_QDRANT_API_KEY}
      AI_QDRANT_COLLECTION: ${AI_QDRANT_COLLECTION:-legal_chunks_v1}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-unused-while-deferred}
      NAFATH_MODE: inactive
      PAYMENT_PROVIDER: deferred
      TRUST_PROXY_HOPS: "1"
      # Leave false — worker is a separate container in this profile
      RUN_WORKER_IN_PROCESS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - pjsr_internal
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    cpus: "0.75"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    image: pjsr-worker:${IMAGE_TAG:-hostinger-local}
    restart: unless-stopped
    env_file:
      - path: .env.hostinger
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-openai}
      AI_LLM_MODE: ${AI_LLM_MODE:-openai}
      AI_EMBEDDING_MODE: ${AI_EMBEDDING_MODE:-openai}
      AI_VECTOR_STORE_MODE: ${AI_VECTOR_STORE_MODE:-qdrant}
      AI_TEXT_EXTRACTOR_MODE: ${AI_TEXT_EXTRACTOR_MODE:-pdf}
      AI_OCR_MODE: ${AI_OCR_MODE:-local}
      AI_OCR_TESSDATA: ${AI_OCR_TESSDATA:-fast}
      AI_ADVISOR_EXPERIMENTAL: ${AI_ADVISOR_EXPERIMENTAL:-true}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-1}
      AI_OCR_CONCURRENCY: ${AI_OCR_CONCURRENCY:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_QDRANT_URL: ${AI_QDRANT_URL}
      AI_QDRANT_API_KEY: ${AI_QDRANT_API_KEY}
      AI_QDRANT_COLLECTION: ${AI_QDRANT_COLLECTION:-legal_chunks_v1}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-unused-while-deferred}
      NAFATH_MODE: inactive
      PAYMENT_PROVIDER: deferred
      AI_OCR_LANG_PATH: /app/.ocr-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - pjsr_internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const Redis=require('ioredis'); const u=process.env.REDIS_URL; if(!u) process.exit(1); const r=new Redis(u,{maxRetriesPerRequest:1,connectTimeout:3000,lazyConnect:true}); r.connect().then(()=>r.ping()).then(()=>r.quit()).then(()=>process.exit(0)).catch(()=>process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    # Keep 768m (do not raise arbitrarily). Pair with AI_WORKER_CONCURRENCY=1
    # and AI_OCR_CONCURRENCY=1 on this host. See docs/PHASE-X3-HOSTINGER-READINESS-FIXES.md.
    mem_limit: 768m
    cpus: "1.00"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_MODE: real
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_AI_ADVISOR_EXPERIMENTAL: ${VITE_AI_ADVISOR_EXPERIMENTAL:-true}
    image: pjsr-frontend:${IMAGE_TAG:-hostinger-local}
    restart: unless-stopped
    networks:
      - pjsr_internal
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Private edge only — 127.0.0.1:8083. Not public. Not on 80/443.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ../nginx/nginx.hostinger-private.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - pjsr_internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 64m
    cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  pjsr_internal:
    driver: bridge
    name: pjsr_internal

volumes:
  pjsr_pg_data:
    name: pjsr_pg_data
  pjsr_redis_data:
    name: pjsr_redis_data
  pjsr_minio_data:
    name: pjsr_minio_data
