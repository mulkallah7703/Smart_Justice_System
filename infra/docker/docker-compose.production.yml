# PJSR — production Docker Compose
#
# Usage (from repository root):
#   cp infra/docker/.env.production.example infra/docker/.env.production
#   # edit secrets — never commit .env.production
#   docker compose -f infra/docker/docker-compose.production.yml --env-file infra/docker/.env.production config
#   docker compose -f infra/docker/docker-compose.production.yml --env-file infra/docker/.env.production up -d --build
#
# Architecture:
#   nginx (public :80/:443) → frontend + api
#   api → postgres, redis, minio (internal)
#   worker → same deps + OpenAI + Qdrant Cloud (external)
#
# Qdrant Cloud remains external — do not add local Qdrant as a production replacement.
# Nafath = inactive | Payment = deferred (not readiness dependencies).

name: sjs-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sjs_prod_pg_data:/var/lib/postgresql/data
    networks:
      - sjs_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published — internal only
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - sjs_prod_redis_data:/data
    networks:
      - sjs_internal
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    # minio/minio was removed from Docker Hub (2026-09). Silo keeps the same
    # S3 API, MINIO_* env, server command, and /minio/health/live check.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - sjs_prod_minio_data:/data
    networks:
      - sjs_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    expose:
      - "9000"
      - "9001"
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET};
      printf '%s\n' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${S3_BUCKET}\",\"arn:aws:s3:::$${S3_BUCKET}/*\"]}]}' > /tmp/sjs-app-policy.json;
      mc admin policy create local sjs-app-policy /tmp/sjs-app-policy.json || true;
      mc admin user add local $${S3_ACCESS_KEY} $${S3_SECRET} || true;
      mc admin policy attach local sjs-app-policy --user $${S3_ACCESS_KEY} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
    networks:
      - sjs_internal
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    image: sjs-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      NAFATH_MODE: inactive
      PAYMENT_PROVIDER: deferred
      TRUST_PROXY_HOPS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sjs_internal
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    image: sjs-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      NAFATH_MODE: inactive
      PAYMENT_PROVIDER: deferred
      AI_OCR_LANG_PATH: /app/.ocr-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - sjs_internal
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_MODE: real
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: sjs-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - sjs_internal
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTS_HOST_PATH:-./certs}:/etc/nginx/certs:ro
      - ${CERTBOT_WWW_PATH:-./certbot-www}:/var/www/certbot:ro
    depends_on:
      - frontend
      - api
    networks:
      - sjs_internal
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  sjs_internal:
    driver: bridge

volumes:
  sjs_prod_pg_data:
  sjs_prod_redis_data:
  sjs_prod_minio_data:
